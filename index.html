<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucralize | Lançamentos Contábeis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2/lib/msal-browser.min.js"></script>
<style>
:root{--sb:#0E1428;--sb2:#152037;--pr:#0C7488;--pr2:#0a6274;--ok:#1F9D6B;--wn:#D98A1E;--er:#F72642;--bg:#F5F7F8;--bd:#E3E7EA}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:#17202B}
.ph h2,#sb .logo h5{font-family:'Comfortaa',sans-serif}
#sb{width:230px;min-height:100vh;background:var(--sb);position:fixed;left:0;top:0;z-index:100;display:flex;flex-direction:column;overflow-y:auto}
#sb .logo{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
#sb .logo h5{color:#fff;margin:0;font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px}
#sb .logo p{color:rgba(255,255,255,.45);margin:2px 0 0;font-size:.72rem}
#sb nav{flex:1;padding:8px 0}
.ns{padding:10px 16px 3px;color:rgba(255,255,255,.35);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.ni{display:flex;align-items:center;padding:8px 16px;color:rgba(255,255,255,.65);cursor:pointer;transition:all .15s;font-size:.83rem;gap:9px;text-decoration:none;border:none;background:none;width:100%;text-align:left}
.ni:hover{background:rgba(255,255,255,.07);color:#fff}
.ni.active{background:var(--pr);color:#fff}
.ni i{width:17px;font-size:.95rem;flex-shrink:0}
#main{margin-left:230px;min-height:100vh;padding:22px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.ph h2{margin:0;font-size:1.35rem;font-weight:700}
.ph p{margin:2px 0 0;color:#64748b;font-size:.82rem}
.card{background:#fff;border-radius:10px;border:1px solid var(--bd);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sc{background:#fff;border-radius:10px;border:1px solid var(--bd);padding:18px}
.sc h6{font-weight:600;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bd);color:#1e293b;font-size:.9rem}
.dt{background:#fff;border-radius:10px;border:1px solid var(--bd);overflow:hidden}
.dth{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.dth h5{margin:0;font-weight:600;font-size:.95rem}
.dt table{margin:0}
.dt table th{background:#f8fafc;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#64748b;font-weight:700;padding:9px 14px}
.dt table td{padding:10px 14px;vertical-align:middle;font-size:.83rem}
.dt table tr:last-child td{border-bottom:none}
.uz{border:2px dashed var(--bd);border-radius:10px;padding:36px;text-align:center;cursor:pointer;transition:all .2s}
.uz:hover,.uz.drag-over{border-color:var(--pr);background:#eff6ff}
.uz i{font-size:2rem;color:#94a3b8}
.uz p{margin:6px 0 0;color:#64748b;font-size:.85rem}
.stat-card{background:#fff;border-radius:10px;border:1px solid var(--bd);padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-icon{width:44px;height:44px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;margin-bottom:10px}
.stat-card h3{font-size:1.65rem;font-weight:700;margin:0}
.stat-card p{margin:2px 0 0;color:#64748b;font-size:.8rem}
.badge-D{background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:4px;font-size:.7rem;font-weight:700}
.badge-C{background:#d1fae5;color:#065f46;padding:2px 7px;border-radius:4px;font-size:.7rem;font-weight:700}
.vd{color:var(--er);font-weight:600}
.vc{color:var(--ok);font-weight:600}
.alert-unid{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:14px;margin-bottom:14px}
.tree-row{display:flex;align-items:center;padding:4px 0;font-size:.82rem}
.tree-row.l4{font-weight:600}
.blink{animation:blink .8s step-end infinite}
@keyframes blink{50%{opacity:0}}
.tag-novo{background:#dcfce7;color:#166534;padding:1px 8px;border-radius:20px;font-size:.7rem;font-weight:700}
.tag-exist{background:#e0e7ff;color:#3730a3;padding:1px 8px;border-radius:20px;font-size:.7rem;font-weight:700}
.tag-banco{background:#f0f9ff;color:#0369a1;border:1px solid #bae6fd;border-radius:6px;padding:4px 10px;font-size:.75rem;display:inline-flex;align-items:center;gap:5px}
.progress-bar-striped{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent)}
select.form-select,input.form-control,textarea.form-control{font-size:.85rem}
label.form-label{font-size:.82rem;font-weight:600;color:#374151;margin-bottom:4px}
.btn{font-size:.83rem}
.btn-sm{font-size:.78rem}
.empty-state{padding:40px;text-align:center;color:#94a3b8}
/* Alinhamento com a paleta institucional Lucralize nos componentes Bootstrap */
.btn-primary{background:var(--pr);border-color:var(--pr)}
.btn-primary:hover,.btn-primary:focus{background:var(--pr2);border-color:var(--pr2)}
.btn-outline-primary{color:var(--pr);border-color:var(--pr)}
.btn-outline-primary:hover{background:var(--pr);border-color:var(--pr)}
.btn-success{background:var(--ok);border-color:var(--ok)}
.btn-success:hover,.btn-success:focus{filter:brightness(.92)}
.btn-outline-danger{color:var(--er);border-color:var(--er)}
.btn-outline-danger:hover{background:var(--er);border-color:var(--er)}
.badge.bg-primary{background:var(--pr)!important}
.badge.bg-success{background:var(--ok)!important}
.badge.bg-warning{background:var(--wn)!important}
.badge.bg-danger{background:var(--er)!important}
a,.login-link{color:var(--pr)}
.form-control:focus,.form-select:focus{border-color:var(--pr);box-shadow:0 0 0 .2rem rgba(12,116,136,.15)}
.empty-state .icon{font-size:2.5rem;margin-bottom:10px}
</style>
</head>

<!-- MODAL: Classificar lançamento não identificado -->
<div class="modal fade" id="mClass" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header" style="background:#fff7ed;border-bottom:1px solid #fed7aa">
        <h5 class="modal-title"><i class="bi bi-exclamation-triangle text-warning me-2"></i>Classificar Lançamento Não Identificado</h5>
        <span id="mClassCount" class="badge bg-warning text-dark ms-2"></span>
      </div>
      <div class="modal-body">
        <div class="alert alert-warning py-2 mb-3">
          <small>Este lançamento não pôde ser classificado automaticamente. Selecione as contas e histórico.</small>
        </div>
        <div id="mClassInfo" class="sc mb-3 py-3" style="background:#f8fafc"></div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Conta Débito *</label>
            <select id="mcDebito" class="form-select"></select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Conta Crédito *</label>
            <select id="mcCredito" class="form-select"></select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Cód. Histórico</label>
            <input type="number" id="mcCodHist" class="form-control" placeholder="Ex: 114">
          </div>
          <div class="col-md-9">
            <label class="form-label">Histórico Complementar</label>
            <input type="text" id="mcHist" class="form-control" placeholder="Descrição do lançamento">
          </div>
          <div class="col-md-6">
            <label class="form-label">Nº Documento</label>
            <input type="text" id="mcDoc" class="form-control" placeholder="NF / DOC">
          </div>
          <div class="col-md-6 d-flex align-items-end">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="mcSalvar" checked>
              <label class="form-check-label" for="mcSalvar" style="font-size:.82rem">Salvar como regra automática</label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary btn-sm" id="btnSkipClass" onclick="skipClass()">Pular</button>
        <button class="btn btn-primary btn-sm" id="btnSaveClass" onclick="saveClass()"><i class="bi bi-check-lg me-1"></i>Salvar e Próximo</button>
      </div>
    </div>
  </div>
</div>

    <div class="modal-content">

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script>
// ============================================================
// GRAPH / EXCEL INTEGRATION (Portal Contábil)
// Fonte de dados: PortalContabil.xlsx numa biblioteca do SharePoint,
// com uma Tabela do Excel por entidade. Reaproveita o app já usado
// pelo central-triagem (login delegado, mesmo tenant).
// ============================================================
const SP_CONFIG = {
  clientId: "05521d3b-877a-4c53-a594-808878d6a469",
  tenantId: "5173aa83-66e1-49f3-9128-f2251b43294d",
  hostname: "lucralize.sharepoint.com",
  driveId: "b!ekISGx37FUa8VJQoVDwcqosBcJf3ciVJhg2HmW7OU_Skpx_nvEGVTIcQ4XWlDxbZ",
  workbookPath: "PI - PROCESSOS E INFRA/AUTOMAÇÕES CLAUDE/portal-contabil/PortalContabil.xlsx",
  extratosFolder: "PI - PROCESSOS E INFRA/AUTOMAÇÕES CLAUDE/portal-contabil/Extratos Importados"
};
const GRAPH_SCOPES = ["Sites.ReadWrite.All","User.Read"];
let _msal=null, _token=null, _driveId=null, _wbItemId=null;

// Trava visual reutilizável pra botões de salvar/confirmar: desabilita e
// mostra um spinner enquanto uma operação assíncrona (Graph/Excel) roda,
// e devolve o texto original depois — evita a sensação de "travou".
function btnBusy(id, loadingHTML){
  const b=document.getElementById(id);
  if(!b) return {restore:()=>{}};
  const orig=b.innerHTML;
  b.disabled=true;
  b.innerHTML=loadingHTML||'<span class="spinner-border spinner-border-sm me-1"></span>Salvando...';
  return {restore:()=>{ b.disabled=false; b.innerHTML=orig; }};
}

function encPath(p){ return p.split('/').map(encodeURIComponent).join('/'); }

async function ensureMsal(){
  if(_msal) return _msal;
  _msal = new msal.PublicClientApplication({
    auth:{clientId:SP_CONFIG.clientId, authority:`https://login.microsoftonline.com/${SP_CONFIG.tenantId}`, redirectUri:window.location.origin+window.location.pathname},
    cache:{cacheLocation:'localStorage'}
  });
  await _msal.initialize();
  return _msal;
}

async function graphLoginInteractive(){
  await ensureMsal();
  const result = await _msal.loginPopup({scopes:GRAPH_SCOPES});
  _token = result.accessToken;
  return result;
}

async function graphLoginSilent(){
  await ensureMsal();
  const accounts = _msal.getAllAccounts();
  if(!accounts.length) throw new Error('sem-conta');
  const result = await _msal.acquireTokenSilent({scopes:GRAPH_SCOPES, account:accounts[0]});
  _token = result.accessToken;
  return result;
}

let _wbSessionId = null;

async function graph(method, path, body, extraHeaders){
  const headers = Object.assign({'Authorization':'Bearer '+_token,'Content-Type':'application/json'}, extraHeaders||{});
  // Sessão persistente do Excel: garante que várias operações em sequência
  // (ex: exclusões em massa) sejam realmente gravadas no arquivo, não só
  // "prontas" numa sessão temporária que pode não persistir a tempo.
  if(_wbSessionId && path.includes('/workbook/')) headers['workbook-session-id']=_wbSessionId;
  const opts = {method, headers, cache:'no-store'};
  if(body!==undefined) opts.body = typeof body==='string' ? body : JSON.stringify(body);
  // Cache-busting extra: evita qualquer resposta antiga guardada por proxy/navegador em GETs
  let url=`https://graph.microsoft.com/v1.0${path}`;
  if(method==='GET') url += (url.includes('?')?'&':'?') + '_cb=' + Date.now();
  const res = await fetch(url, opts);
  if(!res.ok){ const t=await res.text(); throw new Error(`Graph ${method} ${path} -> ${res.status}: ${t}`); }
  if(res.status===204) return null;
  return res.json();
}

async function graphRaw(method, path, arrayBuffer, contentType){
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {method, headers:{'Authorization':'Bearer '+_token,'Content-Type':contentType||'application/octet-stream'}, body:arrayBuffer});
  if(!res.ok){ const t=await res.text(); throw new Error(`Graph ${method} ${path} -> ${res.status}: ${t}`); }
  return res.json();
}

async function resolveWorkbook(){
  if(_wbItemId && _wbSessionId) return;
  if(!_wbItemId){
    _driveId = SP_CONFIG.driveId;
    const item = await graph('GET', `/drives/${_driveId}/root:/${encPath(SP_CONFIG.workbookPath)}`);
    _wbItemId = item.id;
  }
  if(!_wbSessionId){
    try{
      const session = await graph('POST', `/drives/${_driveId}/items/${_wbItemId}/workbook/createSession`, {persistChanges:true});
      _wbSessionId = session.id;
    }catch(err){
      console.error('Não foi possível abrir sessão persistente do Excel, seguindo sem ela:', err);
      toast('Aviso: não consegui abrir uma sessão persistente no Excel (' + err.message + '). Gravações podem não ser salvas de forma confiável.', 'danger');
    }
  }
}

// Fecha a sessão do Excel — força o Excel a "confirmar de vez" as mudanças
// feitas durante a sessão. Chamado ao final de cada operação de gravação;
// a próxima operação abre uma sessão nova automaticamente.
async function closeWbSession(){
  if(!_wbSessionId) return;
  const sid=_wbSessionId;
  _wbSessionId=null; // já libera pra próxima operação abrir sessão nova, mesmo se o close falhar
  try{
    await graph('POST', `/drives/${_driveId}/items/${_wbItemId}/workbook/closeSession`, undefined, {'workbook-session-id':sid});
  }catch(err){
    console.error('Erro ao fechar sessão do Excel:', err);
  }
}

const TABLE_HEADERS = {
  Empresas:['Id','Title','Razao','CNPJ','Regime','Plano','DataEntrada','Nova','Obs'],
  PlanoContas:['Id','Title','Descricao','ContasJSON'],
  Contas:['Id','PlanoId','Codigo','Nome','Tipo','Natureza','Nivel','Aceita','Hp','Ch'],
  Bancos:['Id','Title','Empresa','Banco','Agencia','Conta','Tipo','ContaContabil','Saldo','DataSaldo'],
  Lancamentos:['Id','Empresa','Banco','Data','ContaD','ContaC','Valor','Historico','CodHistorico','Documento','Origem','Conciliado'],
  Regras:['Id','Empresa','Pattern','ContaD','ContaC','Historico','CodHistorico']
};

async function xlGetRows(table){
  await resolveWorkbook();
  const headers = TABLE_HEADERS[table];
  let rows=[], url=`/drives/${_driveId}/items/${_wbItemId}/workbook/tables/Tbl${table}/rows?$top=4999`;
  let guard=0;
  while(url && guard<500){
    guard++;
    const resp = await graph('GET', url);
    rows = rows.concat(resp.value||[]);
    url = resp['@odata.nextLink'] ? resp['@odata.nextLink'].replace('https://graph.microsoft.com/v1.0','') : null;
  }
  warnIfNearRowLimit(table, rows.length);
  return rows.map((r,i)=>{
    const vals=r.values[0];
    const obj={_rowIndex:i};
    headers.forEach((h,ci)=>obj[h]=vals[ci]);
    return obj;
  });
}

// Aviso defensivo: se um dia a tabela passar de 4999 linhas, isso NÃO vai
// pegar tudo (o limite acima precisa subir). Loga no console pra dar sinal.
function warnIfNearRowLimit(table, count){
  if(count>=4999) console.warn(`Tabela ${table} tem ${count}+ linhas — pode estar sendo cortada pelo limite de leitura. Avise o desenvolvedor.`);
}

async function xlAddRow(table, obj){
  await resolveWorkbook();
  const headers = TABLE_HEADERS[table];
  const values = headers.map(h=> obj[h]===undefined||obj[h]===null ? '' : obj[h] );
  await graph('POST', `/drives/${_driveId}/items/${_wbItemId}/workbook/tables/Tbl${table}/rows/add`, {values:[values]});
}

async function xlUpdateRowById(table, id, obj){
  const rows = await xlGetRows(table);
  const row = rows.find(r=>String(r.Id)===String(id));
  if(!row) throw new Error(`Linha Id=${id} não encontrada em ${table}`);
  const headers = TABLE_HEADERS[table];
  const values = headers.map(h=> obj[h]===undefined||obj[h]===null ? '' : obj[h] );
  await graph('PATCH', `/drives/${_driveId}/items/${_wbItemId}/workbook/tables/Tbl${table}/rows/itemAt(index=${row._rowIndex})`, {values:[values]});
}

// Como update: se a linha não existir mais na planilha (ex: foi apagada
// manualmente ou o estado local ficou desatualizado), recria a linha em
// vez de falhar — evita erros de "linha não encontrada" no dia a dia.
async function xlUpsertRowById(table, id, obj){
  try{
    await xlUpdateRowById(table, id, obj);
  }catch(err){
    if(String(err.message).includes('não encontrada')){
      await xlAddRow(table, obj);
    } else {
      throw err;
    }
  }
}

async function xlDeleteRowById(table, id){
  const rows = await xlGetRows(table);
  const row = rows.find(r=>String(r.Id)===String(id));
  if(!row) return;
  await graph('DELETE', `/drives/${_driveId}/items/${_wbItemId}/workbook/tables/Tbl${table}/rows/itemAt(index=${row._rowIndex})`);
}

async function xlUploadFile(filename, arrayBuffer, contentType){
  await resolveWorkbook();
  const path = `${SP_CONFIG.extratosFolder}/${filename}`;
  return graphRaw('PUT', `/drives/${_driveId}/root:/${encPath(path)}:/content`, arrayBuffer, contentType);
}

// -------------------- mapeamento DB <-> linha da tabela --------------------
function empToRow(e){
  const tpl=getTpl(e.planoId);
  return {Id:e.id, Title:e.nome, Razao:e.razao||'', CNPJ:e.cnpj||'', Regime:e.regime||'',
    Plano:tpl?tpl.nome:'', DataEntrada:e.dataEntrada||'', Nova:e.isNova?'Sim':'Não', Obs:e.obs||''};
}
function parseExcelDate(v){
  if(v===undefined||v===null||v==='') return '';
  if(typeof v==='number'){
    // Excel guarda datas como número serial (dias desde 1899-12-30)
    const utcDays=Math.floor(v-25569);
    const utcValue=utcDays*86400;
    return new Date(utcValue*1000).toISOString().slice(0,10);
  }
  return String(v).slice(0,10);
}

function rowToEmp(r){
  const tpl=DB.templates.find(t=>t.nome===r.Plano);
  return {id:String(r.Id), nome:r.Title||'', razao:r.Razao||'', cnpj:String(r.CNPJ||''), regime:r.Regime||'',
    planoId:tpl?tpl.id:null, dataEntrada:parseExcelDate(r.DataEntrada),
    isNova:r.Nova==='Sim', obs:r.Obs||'', razaoImportada:false};
}
// ContasJSON não é mais usado pra guardar dados (as contas ficam na aba
// "Contas", uma por linha) — mas a coluna ainda existe na planilha, então
// mandamos ela vazia só pra manter o número de colunas batendo com a tabela.
function tplToRow(t){ return {Id:t.id, Title:t.nome, Descricao:t.descricao||'', ContasJSON:''}; }

}

// -------------------- carga inicial --------------------
async function loadAllData(){
  const [plRows] = await Promise.all([xlGetRows('PlanoContas')]);
  if(plRows.length===0){
    // Planilha vazia: semeia os 3 templates padrão (com suas contas)
    const defaults=[
      {id:uid(),nome:'Simples Nacional - Padrão',descricao:'Plano padrão para empresas no Simples Nacional',contas:getContasPadrao()},
      {id:uid(),nome:'Lucro Presumido - Padrão',descricao:'Plano padrão para empresas no Lucro Presumido',contas:getContasPadrao()},
      {id:uid(),nome:'Lucro Real - Padrão',descricao:'Plano padrão para empresas no Lucro Real',contas:getContasPadrao()}
    ];
    for(const t of defaults){
      await xlAddRow('PlanoContas', tplToRow(t));
      for(const c of t.contas){ await xlAddRow('Contas', contaToRow(t.id, c)); }
    }
    await closeWbSession();
    DB.templates = defaults;
  } else {
    DB.templates = plRows.filter(r=>r.Id).map(rowToTpl);
  }
  const [empRows, bancoRows, lancRows, regraRows, contaRows] = await Promise.all([
    xlGetRows('Empresas'), xlGetRows('Bancos'), xlGetRows('Lancamentos'), xlGetRows('Regras'), xlGetRows('Contas')
  ]);

  DB.templates.forEach(t=>{ t.contas=(contasPorPlano[t.id]||[]).sort((a,b)=>a.codigo.localeCompare(b.codigo)); });
  DB.movimentos = [];
}

<script>
// ============================================================
// PARSERS
// ============================================================

// --- OFX Parser ---
function parseOFX(content){
  const getTag=(s,tag)=>{const r=new RegExp(`<${tag}>([^<\r\n]+)`,'i');const m=s.match(r);return m?m[1].trim():null;};
  const txns=[];
  const blocks=[...content.matchAll(/<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi)];
  for(const b of blocks){
    const raw=b[1];
    const trntype=getTag(raw,'TRNTYPE')||'';
    const dtposted=getTag(raw,'DTPOSTED')||'';
    const amt=getTag(raw,'TRNAMT')||'0';
    const fitid=getTag(raw,'FITID')||uid();
    const memo=getTag(raw,'MEMO')||getTag(raw,'NAME')||'';
    const valor=parseFloat(amt.replace(',','.'));
    txns.push({
      id:fitid, data:parseDate(dtposted.slice(0,8)),
      valor:Math.abs(valor), tipo:valor>=0?'C':'D',
      descricao:memo, origem:'OFX', conciliado:false
    });
  }
  const bankId=getTag(content,'BANKID');
  const acctId=getTag(content,'ACCTID');
  const saldo=getTag(content,'BALAMT');
  return{transactions:txns, bankId, acctId, saldo:saldo?parseFloat(saldo.replace(',','.')):null};
}

// --- Excel Parser ---
function parseExcel(buffer){
  const wb=XLSX.read(buffer,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  const txns=[];
  let hdr=-1,dc=-1,desc=-1,val=-1,tipo=-1,cred=-1,deb=-1;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const r=rows[i].map(c=>String(c).toLowerCase().trim());
    const hasD=r.some(c=>c.includes('data'));
    const hasV=r.some(c=>c.includes('valor')||c.includes('amount'));
    if(hasD&&hasV){
      hdr=i;
      dc=r.findIndex(c=>c.includes('data'));
      desc=r.findIndex(c=>c.includes('hist')||c.includes('descr')||c.includes('memo')||c.includes('lancamento'));
      val=r.findIndex(c=>c.includes('valor')||c.includes('amount'));
      tipo=r.findIndex(c=>c==='d/c'||c==='tipo'||c==='nat');
      cred=r.findIndex(c=>c.includes('credit')||c==='entrad'||c==='entrada');
      deb=r.findIndex(c=>c.includes('debit')||c==='saida'||c==='saída');
      break;
    }
  }
  if(hdr<0){hdr=0;dc=0;desc=1;val=2;}
  for(let i=hdr+1;i<rows.length;i++){
    const r=rows[i];
    if(!r||r.every(c=>!c))continue;
    const dv=r[dc];
    let dataStr;
    if(typeof dv==='number'){
      const d=XLSX.SSF.parse_date_code(dv);
      if(d) dataStr=`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
      else continue;
    } else { dataStr=parseDate(String(dv)); }
    if(!dataStr)continue;
    let valor;
    // Try separate debit/credit columns first
    if(deb>=0||cred>=0){
      const d2=parseFloat(String(r[deb]||'0').replace(/[^\d,.]/g,'').replace(',','.'));
      const c2=parseFloat(String(r[cred]||'0').replace(/[^\d,.]/g,'').replace(',','.'));
      if(c2>0){valor=c2;txns.push({id:uid(),data:dataStr,valor:c2,tipo:'C',descricao:String(r[desc]||''),origem:'Excel',conciliado:false});}
      if(d2>0){txns.push({id:uid(),data:dataStr,valor:d2,tipo:'D',descricao:String(r[desc]||''),origem:'Excel',conciliado:false});}
      continue;
    }
    valor=parseFloat(String(r[val]||'0').replace(/[^\d,.-]/g,'').replace(',','.'));
    if(isNaN(valor)||valor===0)continue;
    let t='C';
    if(tipo>=0) t=String(r[tipo]).toUpperCase()==='D'?'D':'C';
    else t=valor>=0?'C':'D';
    txns.push({id:uid(),data:dataStr,valor:Math.abs(valor),tipo:t,descricao:String(r[desc]||''),origem:'Excel',conciliado:false});
  }
  return{transactions:txns};
}

// --- PDF Parser (text heuristic) ---
async function parsePDF(buffer){
  if(typeof pdfjsLib==='undefined')return{transactions:[],rawText:'PDF.js não carregado'};
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:buffer}).promise;
  let txt='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    txt+=tc.items.map(i=>i.str).join(' ')+'\n';
  }
  const txns=[];
  // Pattern: DD/MM/YYYY ... value (with optional D/C)
  const pat=/(\d{2}\/\d{2}\/\d{4})\s+(.{3,60?}?)\s+([\d.,]{3,})\s*([DC])?/g;
  let m;
  while((m=pat.exec(txt))!==null){
    const v=parseFloat(m[3].replace(/\./g,'').replace(',','.'));
    if(isNaN(v)||v===0)continue;
    const t=m[4]?m[4]:(v>=0?'C':'D');
    txns.push({id:uid(),data:parseDate(m[1]),valor:Math.abs(v),tipo:t,descricao:m[2].trim(),origem:'PDF',conciliado:false});
  }
  return{transactions:txns,rawText:txt};
}

function renderLastImportBannerHtml(){
  if(!_lastImportIds.length||!_lastImportMeta) return '';
  return `<div class="alert alert-warning d-flex justify-content-between align-items-center py-2 mb-3">
    <div><i class="bi bi-exclamation-triangle me-1"></i>
      Última importação: <strong>${_lastImportIds.length} lançamento(s)</strong> em <strong>${_lastImportMeta.empNome}</strong>
      <small class="text-muted ms-1">(${_lastImportMeta.ts.toLocaleString('pt-BR')})</small>
    </div>
    <button class="btn btn-outline-danger btn-sm" id="btnCancelImport" onclick="cancelarUltimaImportacao()">
      <i class="bi bi-x-circle me-1"></i>Cancelar importação
    </button>
  </div>`;
}

async function cancelarUltimaImportacao(){
  if(!_lastImportIds.length)return;
  if(!confirm(`Excluir ${_lastImportIds.length} lançamento(s) dessa importação? Essa ação não pode ser desfeita.`))return;
  const btn=document.getElementById('btnCancelImport');

  wrap?.classList.remove('d-none');
  let erros=0, feitos=0;
  const total=_lastImportIds.length;
  for(const id of _lastImportIds.slice()){
    try{ await xlDeleteRowById('Lancamentos', id); }
    catch(err){ erros++; console.error(err); feitos++; continue; }
    DB.lancamentos=DB.lancamentos.filter(l=>l.id!==id);
    feitos++;
    if(bar){ const pct=Math.round(feitos/total*100); bar.style.width=pct+'%'; }

async function handleFile(file){
  if(!file)return;
  const empId=document.getElementById('impEmp').value;
  if(!empId){toast('Selecione uma empresa primeiro','warning');return;}
  const tipo=document.getElementById('impTipo').value;
  const st=document.getElementById('impStatus');
  st.innerHTML=`<div class="text-primary small"><i class="bi bi-hourglass-split me-1"></i>Processando ${file.name}...</div>`;
  try{
    const buf=await file.arrayBuffer();
    let result;
    if(tipo==='ofx'){
      const txt=new TextDecoder('iso-8859-1').decode(buf);
      result=parseOFX(txt);
    } else if(tipo==='excel'){
      result=parseExcel(new Uint8Array(buf));
    } else {
      result=await parsePDF(new Uint8Array(buf));
    }
    _importPreview=result.transactions;
    _importEmpId=empId;
    _importBancoId=document.getElementById('impBanco').value||null;
    // Guarda o arquivo original na pasta "Extratos Importados", pro histórico/auditoria
    const emp=getEmp(empId);
    const cnpjSlug=String(emp?.cnpj||'sem-cnpj').replace(/[^0-9]/g,'')||'sem-cnpj';
    const nomeArquivo=`${new Date().toISOString().slice(0,10)}_${cnpjSlug}_${file.name}`.replace(/[\\/:*?"<>|]/g,'-');
    xlUploadFile(nomeArquivo, buf, file.type||'application/octet-stream')
      .catch(err=>{ console.error('Falha ao salvar extrato original:', err); toast('Aviso: não foi possível guardar o arquivo original no OneDrive ('+err.message+')','warning'); });
    st.innerHTML=`<div class="text-success small"><i class="bi bi-check-circle me-1"></i>${_importPreview.length} transações encontradas em ${file.name}</div>`;
    renderPreview(empId);
  } catch(err){
    st.innerHTML=`<div class="text-danger small"><i class="bi bi-x-circle me-1"></i>Erro: ${err.message}</div>`;
  }
}

function handleDrop(e){
  e.preventDefault();
  document.getElementById('dropArea').classList.remove('drag-over');
  const file=e.dataTransfer.files[0];
  if(file) handleFile(file);
}

async function confirmarImport(){
  const empId=_importEmpId;
  const bancoId=_importBancoId;
  if(!empId){toast('Empresa não selecionada','danger');return;}
  // Find unclassified
  const unclass=_importPreview.filter(t=>!t.contaD||!t.contaC);
  // Add classified ones to lancamentos
  const classified=_importPreview.filter(t=>t.contaD&&t.contaC);
  const btn=document.getElementById('btnConfirmar');
  const abortBtn=document.getElementById('btnAbortImport');
  const wrap=document.getElementById('importProgressWrap');
  const bar=document.getElementById('importProgressBar');
  const txt=document.getElementById('importProgressTxt');
  const btnOrig=btn.innerHTML;
  btn.disabled=true;
  btn.innerHTML='<span class="spinner-border spinner-border-sm me-1"></span>Lançando...';
  wrap.classList.remove('d-none');
  _importAborted=false;
  abortBtn.classList.remove('d-none');
  abortBtn.disabled=false;
  abortBtn.innerHTML='<i class="bi bi-x-circle me-1"></i>Cancelar';
  let erros=0, feitos=0;
  // Nova importação: reseta o rastreamento de "cancelar importação"
  _lastImportIds=[]; _lastImportMeta={empNome:(getEmp(empId)||{}).nome||'', ts:new Date()};
  for(const t of classified){
    if(_importAborted) break;
    const novo={
      id:uid(),empId,bancoId,data:t.data,
      contaD:t.contaD,contaC:t.contaC,
      valor:t.valor,hist:t.hist||t.descricao,
      codHist:t.codHist||'',doc:t.doc||'',
      origem:t.origem,conciliado:false
    };
    try{ await xlAddRow('Lancamentos', lancToRow(novo)); }
    catch(err){ erros++; console.error(err); feitos++; continue; }
    DB.lancamentos.push(novo);
    DB.movimentos.push({...t,empId,bancoId});
    _lastImportIds.push(novo.id);
    feitos++;
    const pct=Math.round(feitos/classified.length*100);
    bar.style.width=pct+'%';
    txt.textContent=`Lançando ${feitos} de ${classified.length}...`;
  }
  wrap.classList.add('d-none');
  abortBtn.classList.add('d-none');
  btn.disabled=false; btn.innerHTML=btnOrig;
  if(_importAborted){
    await closeWbSession();
    toast(`Importação cancelada. ${feitos} de ${classified.length} lançados antes de parar.`,'warning');
    _importPreview=_importPreview.filter(t=>!classified.slice(0,feitos).includes(t));
    go('lanc');
    return;
  }
  if(erros>0) toast(`${erros} lançamento(s) não puderam ser gravados no Excel — veja o console.`,'danger');
  if(unclass.length>0){
    _classQueue=unclass; _classIdx=0; _classEmpId=empId;
    toast(`${classified.length-erros} lançados. Classificando ${unclass.length} não identificados...`,'warning');
    openClassModal();
  } else {
    await closeWbSession();
    toast(`${classified.length-erros} lançamentos registrados com sucesso!`);
    _importPreview=[];
    go('lanc');
  }
}

  abortBtn.disabled=true;
  abortBtn.innerHTML='<span class="spinner-border spinner-border-sm me-1"></span>Parando...';
}

let _lancSelected=new Set();
let _delLancAborted=false;

function toggleLancSel(id,checked){
  if(checked) _lancSelected.add(id); else _lancSelected.delete(id);
  updateLancSelBar();
}

function toggleLancSelAll(checked){
  document.querySelectorAll('.lancChk').forEach(cb=>{
    cb.checked=checked;
    if(checked) _lancSelected.add(cb.value); else _lancSelected.delete(cb.value);
  });
  updateLancSelBar();
}

function updateLancSelBar(){
  const n=_lancSelected.size;
  const btn=document.getElementById('btnDelSelected');
  document.getElementById('lancSelCount').textContent=n;
  btn.classList.toggle('d-none', n===0);
  const all=document.getElementById('lancChkAll');
  if(all){
    const total=document.querySelectorAll('.lancChk').length;
    all.checked = total>0 && n===total;
  }
}

async function delLancSelecionados(){
  const ids=Array.from(_lancSelected);
  if(!ids.length)return;
  if(!confirm(`Excluir ${ids.length} lançamento(s) selecionado(s)? Essa ação não pode ser desfeita.`))return;
  const btn=document.getElementById('btnDelSelected');
  const abortBtn=document.getElementById('btnAbortDelLanc');
  const wrap=document.getElementById('importProgressWrap2');
  const bar=document.getElementById('importProgressBar2');
  const txt=document.getElementById('importProgressTxt2');
  const btnOrig=btn.innerHTML;
  btn.disabled=true;
  btn.innerHTML='<span class="spinner-border spinner-border-sm me-1"></span>Excluindo...';
  wrap.classList.remove('d-none');
  _delLancAborted=false;
  abortBtn.classList.remove('d-none');
  abortBtn.disabled=false;
  abortBtn.innerHTML='<i class="bi bi-x-circle me-1"></i>Cancelar';
  let erros=0, feitos=0;
  for(const id of ids){
    if(_delLancAborted) break;
    try{ await xlDeleteRowById('Lancamentos', id); }
    catch(err){ erros++; console.error(err); feitos++; continue; }
    DB.lancamentos=DB.lancamentos.filter(l=>l.id!==id);
    _lancSelected.delete(id);
    feitos++;
    const pct=Math.round(feitos/ids.length*100);
    bar.style.width=pct+'%';
    txt.textContent=`Excluindo ${feitos} de ${ids.length}...`;
  }
  wrap.classList.add('d-none');
  abortBtn.classList.add('d-none');
  btn.disabled=false; btn.innerHTML=btnOrig;
  await closeWbSession();
  if(_delLancAborted){
    // mantém selecionados os que ainda não foram excluídos, pra poder continuar depois
    toast(`Exclusão cancelada. ${feitos} de ${ids.length} excluídos antes de parar.`,'warning');
  } else {
    _lancSelected.clear();
    if(erros>0) toast(`${erros} lançamento(s) não puderam ser excluídos — veja o console.`,'danger');
    else toast(`${feitos} lançamento(s) excluído(s)!`,'warning');
  }
  renderLancTable();
}

function abortDelLancSelecionados(){
  _delLancAborted=true;
  const abortBtn=document.getElementById('btnAbortDelLanc');
  abortBtn.disabled=true;
  abortBtn.innerHTML='<span class="spinner-border spinner-border-sm me-1"></span>Parando...';

function renderLancTable(){
  const empId=document.getElementById('filtEmp')?.value||'';
  const de=document.getElementById('filtDe')?.value||'';
  const ate=document.getElementById('filtAte')?.value||'';
  const busca=(document.getElementById('filtBusca')?.value||'').toLowerCase();
  let data=DB.lancamentos.filter(l=>{
    if(empId&&l.empId!==empId)return false;
    if(de&&l.data<de)return false;
    if(ate&&l.data>ate)return false;
    if(busca&&!`${l.contaD} ${l.contaC} ${l.hist||''} ${l.doc||''}`.toLowerCase().includes(busca))return false;
    return true;
  }).reverse();
  const cnt=document.getElementById('lancCount');
  if(cnt)cnt.textContent=data.length;
  const el=document.getElementById('lancTable');
  if(!el)return;
  if(data.length===0){el.innerHTML='<div class="empty-state py-4"><p>Nenhum lançamento encontrado</p></div>';updateLancSelBar();return;}
  el.innerHTML=`<div class="table-responsive"><table class="table table-hover table-sm mb-0">
    <thead><tr>
      <th style="width:28px"><input type="checkbox" id="lancChkAll" onchange="toggleLancSelAll(this.checked)"></th>

    <tbody>${data.map(l=>{
      const e=getEmp(l.empId);
      const b=l.bancoId?DB.bancos.find(b=>b.id===l.bancoId):null;
      return`<tr>
        <td><input type="checkbox" class="lancChk" value="${l.id}" ${_lancSelected.has(l.id)?'checked':''} onchange="toggleLancSel('${l.id}',this.checked)"></td>
        <td><small>${fmtDate(l.data)}</small></td>
        <td><small>${e?e.nome:'-'}</small></td>
        <td><small>${b?b.apelido:'-'}</small></td>
        <td><small class="vd">${l.contaD}</small></td>
        <td><small class="vc">${l.contaC}</small></td>
        <td><strong>${R$(l.valor)}</strong></td>
        <td><small title="${l.hist||''}">${(l.hist||'').slice(0,30)}</small></td>
        <td><small>${l.doc||'-'}</small></td>
        <td><span class="badge bg-light text-muted">${l.origem||'-'}</span></td>
        <td>${l.conciliado?'<span class="badge bg-success">Sim</span>':'<span class="badge bg-warning text-dark">Não</span>'}</td>
        <td>
          <button class="btn btn-xs btn-outline-secondary me-1" style="padding:1px 5px;font-size:.7rem" onclick="openLancModal('${l.id}')"><i class="bi bi-pencil"></i></button>

      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
  updateLancSelBar();

async function saveLanc(){
  const editId=document.getElementById('mlId').value;
  const empId=document.getElementById('mlEmp').value;
  const data=document.getElementById('mlData').value;
  const contaD=document.getElementById('mlDebito').value;
  const contaC=document.getElementById('mlCredito').value;
  const valor=parseFloat(document.getElementById('mlValor').value);
  if(!empId||!data||!contaD||!contaC||isNaN(valor)||valor<=0){
    toast('Preencha todos os campos obrigatórios','danger');return;
  }
  const campos={
    empId,bancoId:document.getElementById('mlBanco').value||null,
    data,contaD,contaC,valor,
    hist:document.getElementById('mlHist').value,
    codHist:document.getElementById('mlCodH').value,
    doc:document.getElementById('mlDoc').value,
    origem:document.getElementById('mlOrigem').value
  };
  const lock=btnBusy('btnSaveLanc');
  try{
    if(editId){
      const l=DB.lancamentos.find(x=>x.id===editId);
      if(!l){lock.restore(); toast('Lançamento não encontrado','danger');return;}
      Object.assign(l,campos);
      await xlUpsertRowById('Lancamentos', editId, lancToRow(l));
    } else {
      const novo={id:uid(),...campos,conciliado:false};
      await xlAddRow('Lancamentos', lancToRow(novo));
      DB.lancamentos.push(novo);
    }
  } catch(err){ lock.restore(); toast('Erro ao salvar no Excel: '+err.message,'danger'); return; }
  await closeWbSession();
  lock.restore();
  bootstrap.Modal.getInstance(document.getElementById('mLanc'))?.hide();
  toast(editId?'Lançamento atualizado!':'Lançamento registrado!');
  if(_view==='lanc') renderLancTable();

function runConcil(){
  const empId=document.getElementById('cEmp').value;
  const bancoId=document.getElementById('cBanco').value;
  const de=document.getElementById('cDe').value;
  const ate=document.getElementById('cAte').value;
  if(!empId){toast('Selecione uma empresa','warning');return;}

  const emp=getEmp(empId);
  // Get accounting entries for period
  let lancs=DB.lancamentos.filter(l=>l.empId===empId);
  if(bancoId) lancs=lancs.filter(l=>l.bancoId===bancoId);
  if(de) lancs=lancs.filter(l=>l.data>=de);
  if(ate) lancs=lancs.filter(l=>l.data<=ate);

  // Get bank movements for period
  let movs=DB.movimentos.filter(m=>m.empId===empId);
  if(bancoId) movs=movs.filter(m=>m.bancoId===bancoId);
  if(de) movs=movs.filter(m=>m.data>=de);
  if(ate) movs=movs.filter(m=>m.data<=ate);

  // Group by date for daily reconciliation
  const dates=new Set([...lancs.map(l=>l.data),...movs.map(m=>m.data)].filter(Boolean));
  const sortedDates=[...dates].sort();

  const rows=sortedDates.map(date=>{
    const dayLancs=lancs.filter(l=>l.data===date);
    const dayMovs=movs.filter(m=>m.data===date);
    const saldoContabil=dayLancs.reduce((s,l)=>{
      const c=getContasAnaliticas(empId).find(c=>c.codigo===l.contaC);
      return s+(c&&c.natureza==='C'?l.valor:-l.valor);
    },0);
    const saldoBanco=dayMovs.reduce((s,m)=>s+(m.tipo==='C'?m.valor:-m.valor),0);
    const dif=Math.abs(saldoContabil-saldoBanco);
    const ok=dif<0.01;
    return{date,dayLancs,dayMovs,saldoContabil,saldoBanco,dif,ok};
  });

  const pendentes=lancs.filter(l=>!l.conciliado);
  // Mark as conciliado
  lancs.forEach(l=>l.conciliado=true);

  const result=document.getElementById('concilResult');
  result.innerHTML=`
  <div class="row g-3 mb-3">
    <div class="col-md-3"><div class="stat-card">
      <div class="stat-icon" style="background:#f0fdf4">📄</div>
      <h3>${lancs.length}</h3><p>Lançamentos no período</p>
    </div></div>
    <div class="col-md-3"><div class="stat-card">
      <div class="stat-icon" style="background:#eff6ff">🏦</div>
      <h3>${movs.length}</h3><p>Movimentos bancários</p>
    </div></div>
    <div class="col-md-3"><div class="stat-card">
      <div class="stat-icon" style="background:#f0fdf4">✅</div>
      <h3>${rows.filter(r=>r.ok).length}</h3><p>Dias conciliados</p>
    </div></div>
    <div class="col-md-3"><div class="stat-card">
      <div class="stat-icon" style="background:#fff7ed">⚠️</div>
      <h3 class="${rows.filter(r=>!r.ok).length>0?'text-warning':''}">${rows.filter(r=>!r.ok).length}</h3><p>Dias com divergência</p>
    </div></div>
  </div>
  <div class="dt">
    <div class="dth"><h5>Conciliação Diária</h5>
      ${pendentes.length>0?`<button class="btn btn-warning btn-sm" onclick="classifyPending('${empId}')"><i class="bi bi-exclamation-triangle me-1"></i>Classificar ${pendentes.length} pendentes</button>`:''}
    </div>
    ${rows.length===0?`<div class="empty-state py-3"><p>Nenhum dado no período selecionado</p></div>`:`
    <table class="table table-sm mb-0">
      <thead><tr><th>Data</th><th>Lanç. Contábeis</th><th>Saldo Contábil</th><th>Movimentos Banco</th><th>Saldo Banco</th><th>Diferença</th><th>Status</th></tr></thead>
      <tbody>${rows.map(r=>`<tr class="${r.ok?'':r.dif<10?'table-warning':'table-danger'}">
        <td><strong>${fmtDate(r.date)}</strong></td>
        <td>${r.dayLancs.length}</td>
        <td>${R$(r.saldoContabil)}</td>
        <td>${r.dayMovs.length}</td>
        <td>${R$(r.saldoBanco)}</td>
        <td class="${r.ok?'text-success':r.dif<10?'text-warning':'text-danger'}">${r.ok?'—':R$(r.dif)}</td>
        <td>${r.ok?'<span class="badge bg-success">✓ OK</span>':r.dif<10?'<span class="badge bg-warning text-dark">Diferença pequena</span>':'<span class="badge bg-danger">Divergente</span>'}</td>
      </tr>`).join('')}</tbody>
    </table>`}
  </div>`;
}

function classifyPending(empId){
  const pendentes=DB.lancamentos.filter(l=>l.empId===empId&&!l.conciliado);
  if(pendentes.length===0){toast('Nenhum lançamento pendente');return;}
  _classQueue=pendentes.map(l=>({...l,_isLanc:true}));

async function processRazao(file){
  if(!file)return;
  const empId=document.getElementById('razEmp').value;
  const emp=getEmp(empId);
  const st=document.getElementById('razStatus');
  if(!empId){toast('Selecione a empresa','warning');return;}
  if(emp&&emp.isNova){
    document.getElementById('razEmpWarn').textContent='Cliente novo — não é necessário importar razão.';
    return;
  }
  st.innerHTML=`<div class="text-primary small"><i class="bi bi-hourglass-split me-1"></i>Processando razão...</div>`;
  try{
    const buf=await file.arrayBuffer();
    const tipo=document.getElementById('razTipo').value;
    let rows=[];
    if(tipo==='excel'){
      const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    } else {
      const res=await parsePDF(new Uint8Array(buf));
      rows=res.rawText.split('\n').map(l=>[l]);
    }
    // Extract patterns: look for description + conta debito + conta credito
    let learned=0, erros=0;
    for(const row of rows){
      if(!row||!row[0])continue;
      // Try columns: hist/desc, contaD, contaC
      const desc=String(row[0]||row[1]||'').trim();
      const cd=String(row[2]||row[3]||'').trim();
      const cc=String(row[3]||row[4]||'').trim();
      if(desc.length>3&&cd.match(/\d+\.\d+/)&&cc.match(/\d+\.\d+/)){
        const pattern=desc.slice(0,30).toLowerCase();
        if(!DB.regras.find(r=>r.empId===empId&&r.pattern===pattern)){
          const novaRegra={id:uid(),empId,pattern,contaD:cd,contaC:cc,hist:desc,codHist:''};
          try{
            await xlAddRow('Regras', regraToRow(novaRegra));
            DB.regras.push(novaRegra);
            learned++;
          }catch(err){ erros++; console.error(err); }
        }
      }
    }
    if(erros>0) toast(`${erros} regra(s) não puderam ser gravadas no Excel — veja o console.`,'danger');
    if(emp) emp.razaoImportada=true;
    st.innerHTML=`<div class="text-success small"><i class="bi bi-check-circle me-1"></i>${learned} regras aprendidas de ${file.name}</div>`;
    toast(`${learned} regras aprendidas do razão!`);
    go('razao');
  } catch(err){
    st.innerHTML=`<div class="text-danger small">Erro: ${err.message}</div>`;
  }
}

function handleRazDrop(e){
  e.preventDefault();
  document.getElementById('razDrop').classList.remove('drag-over');
  processRazao(e.dataTransfer.files[0]);
}

async function delRegra(i){
  const reg=DB.regras[i];
  if(reg){ try{ await xlDeleteRowById('Regras', reg.id); }catch(err){ toast('Erro ao excluir no Excel: '+err.message,'danger'); return; } }
  await closeWbSession();
  DB.regras.splice(i,1);
  go('razao');
  toast('Regra removida','warning');
}

function buildDominioLines(empId,de,ate,user){
  const emp=getEmp(empId);
  if(!emp)return[];
  let lancs=DB.lancamentos.filter(l=>l.empId===empId);
  if(de)lancs=lancs.filter(l=>l.data>=de);
  if(ate)lancs=lancs.filter(l=>l.data<=ate);
  lancs.sort((a,b)=>a.data.localeCompare(b.data));
  const mes=de?`${de.slice(5,7)}/${de.slice(0,4)}`:`${new Date().toLocaleDateString('pt-BR',{month:'2-digit',year:'numeric'})}`;
  const lines=[`1;${emp.cnpj||'00.000.000/0001-00'};${mes};${user||'Lucralize'}`];
  lancs.forEach(l=>{
    lines.push(`2;${fmtDateExport(l.data)};${l.contaD};${l.contaC};${fmtBR(l.valor)};${l.codHist||''};${(l.hist||'').replace(/;/g,' ')};${l.doc||''}`);
  });
  return{lines,count:lancs.length};
}

function previewDominio(){
  const empId=document.getElementById('expEmp')?.value;
  const de=document.getElementById('expDe')?.value;
  const ate=document.getElementById('expAte')?.value;
  const user=document.getElementById('expUser')?.value;
  const el=document.getElementById('expPreview');
  const cnt=document.getElementById('expCount');
  if(!el||!cnt)return;
  if(!empId){el.innerHTML='<div class="text-muted">Selecione a empresa...</div>';return;}
  const {lines,count}=buildDominioLines(empId,de,ate,user);
  cnt.textContent=`${count} registros`;
  el.innerHTML=lines.slice(0,50).map(l=>`<div>${l}</div>`).join('')+(lines.length>50?`<div class="text-muted">... e mais ${lines.length-50} linhas</div>`:'');
}

function gerarDominio(){
  const empId=document.getElementById('expEmp')?.value;
  const de=document.getElementById('expDe')?.value;
  const ate=document.getElementById('expAte')?.value;
  const user=document.getElementById('expUser')?.value;
  if(!empId){toast('Selecione a empresa','warning');return;}
  const {lines,count}=buildDominioLines(empId,de,ate,user);
  if(count===0){toast('Nenhum lançamento no período','warning');return;}
  const content=lines.join('\r\n');
  const blob=new Blob([content],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const emp=getEmp(empId);
  a.href=url;
  a.download=`dominio_${(emp.nome||'empresa').replace(/\s/g,'_')}_${de||'periodo'}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`Arquivo gerado com ${count} lançamentos!`);
}

// -------------------- Importar plano de contas do Domínio --------------------
// Lê o arquivo Excel exportado do Domínio (relatório "Plano de Contas"),
// reconhecendo o layout: uma célula com o código hierárquico (ex: 1.1.1.01.0001),
// o marcador "S" pra contas sintéticas (não aceitam lançamento), o nome
// indentado conforme o nível, e o grau na última coluna preenchida da linha.
function parseContasDominio(rows){
  const contas=[];
  for(const r of rows){
    if(!r||r.length===0) continue;
    const codIdx=r.findIndex(c=>typeof c==='string' && /^\d{1,2}(\.\d{1,4}){0,4}$/.test(c.trim()));
    if(codIdx<0) continue;
    const codigo=r[codIdx].trim();
    const isSint=r.slice(0,codIdx).some(c=>String(c).trim().toUpperCase()==='S');
    let grau=null;
    for(let i=r.length-1;i>codIdx;i--){
      const v=r[i];
      if(v!==''&&v!==null&&v!==undefined&&!isNaN(Number(v))){ grau=Number(v); break; }
    }
    if(grau===null) continue;
    let nome='';
    for(let i=codIdx+1;i<r.length;i++){
      const v=r[i];
      if(v===''||v===null||v===undefined) continue;
      if(!isNaN(Number(v))) continue;
      nome=String(v).trim();
      break;
    }
    if(!nome) continue;
    let tipo='Despesa', natureza='D';
    if(codigo.startsWith('1')){ tipo='Ativo'; natureza='D'; }
    else if(codigo.startsWith('2.3')){ tipo='PL'; natureza='C'; }
    else if(codigo.startsWith('2')){ tipo='Passivo'; natureza='C'; }
    else if(codigo.startsWith('3.1')){ tipo='Custos'; natureza='D'; }
    else if(codigo.startsWith('3')){ tipo='Despesa'; natureza='D'; }
    else if(codigo.startsWith('4')){ tipo='Receita'; natureza='C'; }
    else if(codigo.startsWith('5')){ tipo='Despesa'; natureza='D'; } // contas de apuração
    contas.push({id:uid(), codigo, nome, tipo, natureza, nivel:grau, aceita:!isSint, hp:'', ch:0});
  }
  return contas;
}

async function handleDominioFile(file){
  if(!file||!_tplEdit) return;
  if(_tplEdit.contas.length>0 && !confirm('Isso substituirá TODAS as contas atuais desse template pelo conteúdo do arquivo do Domínio. Continuar?')) return;
  let contas;
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    contas=parseContasDominio(rows);
  }catch(err){ toast('Erro ao ler o arquivo: '+err.message,'danger'); return; }
  if(contas.length===0){ toast('Não encontrei nenhuma conta reconhecível nesse arquivo.','danger'); return; }
  const antigas=_tplEdit.contas.slice();
  const wrap=document.getElementById('domImportProgressWrap');
  const bar=document.getElementById('domImportProgressBar');
  const txt=document.getElementById('domImportProgressTxt');
  wrap.classList.remove('d-none');
  const total=antigas.length+contas.length;
  let feito=0, erros=0;
  try{
    for(const c of antigas){
      try{ await xlDeleteRowById('Contas', c.id); }catch(err){ erros++; console.error(err); }
      feito++; bar.style.width=Math.round(feito/total*100)+'%'; txt.textContent=`Removendo contas antigas... ${feito}/${total}`;
    }
    for(const c of contas){
      try{ await xlAddRow('Contas', contaToRow(_tplEdit.id, c)); }catch(err){ erros++; console.error(err); }
      feito++; bar.style.width=Math.round(feito/total*100)+'%'; txt.textContent=`Gravando contas do Domínio... ${feito}/${total}`;
    }
  } finally {
    wrap.classList.add('d-none');
  }
  await closeWbSession();
  _tplEdit.contas=contas.sort((a,b)=>a.codigo.localeCompare(b.codigo));
  upsertLocalTpl();
  document.getElementById('contasBody').innerHTML=renderContasRows();
  document.getElementById('domFileInp').value='';
  if(erros>0) toast(`Importado com ${erros} erro(s) — veja o console.`,'danger');
  else toast(`${contas.length} contas importadas do Domínio!`);
}

let _classModalInst=null;

function openClassModal(){
  if(_classQueue.length===0)return;
  const modal=document.getElementById('mClass');
  _classModalInst=bootstrap.Modal.getOrCreateInstance(modal,{backdrop:'static'});

async function fillClassModal(){
  if(_classIdx>=_classQueue.length){
    _classModalInst?.hide();
    await closeWbSession();
    toast(`Todas as classificações concluídas! ${_classQueue.length} lançamentos processados.`);
    go('lanc');
    return;
  }
  const txn=_classQueue[_classIdx];
  const empId=_classEmpId;
  const total=_classQueue.length;
  // Update counter
  document.getElementById('mClassCount').textContent=`${_classIdx+1} / ${total}`;
  // Transaction info
  document.getElementById('mClassInfo').innerHTML=`
    <div class="row g-2">
      <div class="col-6"><small class="text-muted">Data</small><div class="fw-semibold">${fmtDate(txn.data)}</div></div>
      <div class="col-6"><small class="text-muted">Tipo</small><div class="${txn.tipo==='C'?'vc':'vd'} fw-semibold">${txn.tipo==='C'?'💚 Entrada (Crédito)':'🔴 Saída (Débito)'}</div></div>
      <div class="col-6"><small class="text-muted">Valor</small><div class="fw-semibold">${R$(txn.valor)}</div></div>
      <div class="col-6"><small class="text-muted">Origem</small><div>${txn.origem||'-'}</div></div>
      <div class="col-12"><small class="text-muted">Descrição</small><div class="fw-semibold">${txn.descricao||'-'}</div></div>
    </div>`;
  // Populate account selects
  const contas=getContasAnaliticas(empId);
  const opts='<option value="">Selecione...</option>'+contas.map(c=>`<option value="${c.codigo}">${c.codigo} - ${c.nome}</option>`).join('');
  document.getElementById('mcDebito').innerHTML=opts;
  document.getElementById('mcCredito').innerHTML=opts;
  // Auto-suggest based on type
  if(txn.tipo==='C'){
    // Entry: D=Bank, C=Revenue
    const bankConta=contas.find(c=>c.nome.toLowerCase().includes('banco'));
    const revConta=contas.find(c=>c.tipo==='Receita');
    if(bankConta) document.getElementById('mcDebito').value=bankConta.codigo;
    if(revConta) document.getElementById('mcCredito').value=revConta.codigo;
  } else {
    // Exit: D=Expense, C=Bank
    const bankConta=contas.find(c=>c.nome.toLowerCase().includes('banco'));
    const expConta=contas.find(c=>c.tipo==='Despesa');
    if(expConta) document.getElementById('mcDebito').value=expConta.codigo;
    if(bankConta) document.getElementById('mcCredito').value=bankConta.codigo;
  }
  // Autofill history from description
  document.getElementById('mcHist').value=txn.descricao?.slice(0,80)||'';
  document.getElementById('mcCodHist').value=txn.codHist||'';
  document.getElementById('mcDoc').value=txn.doc||'';
  document.getElementById('mcSalvar').checked=true;
}

async function saveClass(){
  const txn=_classQueue[_classIdx];
  const contaD=document.getElementById('mcDebito').value;
  const contaC=document.getElementById('mcCredito').value;
  const hist=document.getElementById('mcHist').value;
  const codHist=document.getElementById('mcCodHist').value;
  const doc=document.getElementById('mcDoc').value;
  const salvar=document.getElementById('mcSalvar').checked;
  if(!contaD||!contaC){toast('Selecione conta débito e crédito','danger');return;}
  const btn=document.getElementById('btnSaveClass'), btnSkip=document.getElementById('btnSkipClass');
  const btnOrig=btn.innerHTML;
  btn.disabled=true; btnSkip.disabled=true;
  btn.innerHTML='<span class="spinner-border spinner-border-sm me-1"></span>Salvando...';
  try{
    // Create/atualiza lancamento
    const isLanc=txn._isLanc;
    if(isLanc){
      const l=DB.lancamentos.find(l=>l.id===txn.id);
      if(l){
        l.contaD=contaD;l.contaC=contaC;l.hist=hist;l.codHist=codHist;l.doc=doc;l.conciliado=true;
        await xlUpsertRowById('Lancamentos', l.id, lancToRow(l));
      }
    } else {
      const novo={
        id:uid(),empId:_classEmpId,bancoId:_importBancoId||txn.bancoId||null,
        data:txn.data,contaD,contaC,valor:txn.valor,hist,codHist,doc,
        origem:txn.origem||'Import',conciliado:true
      };
      await xlAddRow('Lancamentos', lancToRow(novo));
      DB.lancamentos.push(novo);
      if(!txn._isLanc) _lastImportIds.push(novo.id);
    }
    // Salva regra
    if(salvar&&txn.descricao){
      const pattern=txn.descricao.slice(0,30).toLowerCase().trim();
      if(!DB.regras.find(r=>r.empId===_classEmpId&&r.pattern===pattern)){
        const novaRegra={id:uid(),empId:_classEmpId,pattern,contaD,contaC,hist,codHist};
        await xlAddRow('Regras', regraToRow(novaRegra));
        DB.regras.push(novaRegra);
      }
    }
  }catch(err){
    toast('Erro ao salvar no Excel: '+err.message,'danger');
    btn.disabled=false; btnSkip.disabled=false; btn.innerHTML=btnOrig;
    return;
  }
  btn.disabled=false; btnSkip.disabled=false; btn.innerHTML=btnOrig;
  _classIdx++;
  fillClassModal();
}

async function skipClass(){
  _classIdx++;
  if(_classIdx>=_classQueue.length){
    _classModalInst?.hide();
    await closeWbSession();
    toast(`Classificação encerrada. ${_classIdx} itens processados.`,'warning');
    go('lanc');
  } else {
    fillClassModal();
  }
}
